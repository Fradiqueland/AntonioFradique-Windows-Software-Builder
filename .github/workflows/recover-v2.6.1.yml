name: Recover verified v2.6.1 installers

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: recover-verified-v2.6.1
  cancel-in-progress: false

jobs:
  publish-original-payloads:
    if: >-
      github.event.pull_request.number == 6 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.title == 'v2.6.1: recover verified installers from run 39344259482'
    name: Publish original attempt-1 verified installers
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact native-tested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: a309fdcc9ab69bcf0f080e18444991dedb116e37
          persist-credentials: false
      - name: Read the recovery-only helper from this PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .recovery
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify all original native gates and reject product changes
        run: node .recovery/.github/scripts/recover-v2.6.1.cjs validate
      # Exact original cache keys AND original paths retain cache version/scope.
      # No prefix fallback, proof rewriting or current-run impersonation.
      - name: Restore the original Windows release payload
        id: windows
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          key: wsmb-release-v1-a34f0da74a1f10eb0c83ed81b8208874eaa6167e-39344259482-1-Windows
          path: Windows-Mac-Software-Builder/dist/release/Windows
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Restore the original macOS release payload
        id: mac
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          key: wsmb-release-v1-a34f0da74a1f10eb0c83ed81b8208874eaa6167e-39344259482-1-macOS
          path: Windows-Mac-Software-Builder/dist/release/macOS
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Verify original proofs and native hashes then publish
        env:
          WINDOWS_CACHE_HIT: ${{ steps.windows.outputs.cache-hit }}
          MAC_CACHE_HIT: ${{ steps.mac.outputs.cache-hit }}
        run: |
          test "$WINDOWS_CACHE_HIT" = true
          test "$MAC_CACHE_HIT" = true
          node .recovery/.github/scripts/recover-v2.6.1.cjs publish
