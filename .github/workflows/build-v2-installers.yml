name: Build Windows and Mac installers

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'codex/**']
    tags: ['v2.*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: v2-installers-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: Windows-Mac-Software-Builder

# Cache transfers are isolated to the exact commit, run, attempt and target.
# Re-run all jobs together: no fallback to outputs from an earlier attempt.
env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  # Only the explicit ad-hoc signing hook runs; no signing credentials exist.
  CSC_FOR_PULL_REQUEST: 'true'
  TESTED_SOURCE_SHA: ${{ github.sha }}
  RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  ffmpeg-native:
    name: FFmpeg from verified sources (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
          - target: mac-x64
            runner: macos-15-intel
          - target: mac-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install native Windows build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            make tar xz bzip2 diffutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
      - name: Install native Mac build tools
        if: runner.os == 'macOS'
        run: brew install nasm pkg-config
      - name: Compile and transcode with native Windows FFmpeg
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -o pipefail
          bash scripts/build-ffmpeg.sh '${{ matrix.target }}' 2>&1 | tee build-ffmpeg.log
      - name: Compile and transcode with native Mac FFmpeg
        if: runner.os == 'macOS'
        run: bash scripts/build-ffmpeg.sh '${{ matrix.target }}' 2>&1 | tee build-ffmpeg.log
      - name: Transfer verified native runtime through cache
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          key: wsmb-runtime-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: Windows-Mac-Software-Builder/dist/runtime-native/${{ matrix.target }}.tar.gz
          enableCrossOsArchive: true

  viewer-templates:
    name: Viewer template (${{ matrix.target }})
    needs: ffmpeg-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            platform: win
            runtime: windows-x64
            runner: windows-latest
          - target: mac-universal
            platform: mac
            runtime: mac-universal
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Windows-Mac-Software-Builder/package-lock.json
      - name: Restore exact windows-x64 runtime
        if: matrix.runtime == 'windows-x64'
        id: runtime_windows
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          key: wsmb-runtime-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-windows-x64
          path: Windows-Mac-Software-Builder/dist/runtime-native/windows-x64.tar.gz
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Restore exact mac-x64 runtime
        if: matrix.runtime == 'mac-universal'
        id: runtime_mac_x64
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          key: wsmb-runtime-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-mac-x64
          path: Windows-Mac-Software-Builder/dist/runtime-native/mac-x64.tar.gz
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Restore exact mac-arm64 runtime
        if: matrix.runtime == 'mac-universal'
        id: runtime_mac_arm64
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          key: wsmb-runtime-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-mac-arm64
          path: Windows-Mac-Software-Builder/dist/runtime-native/mac-arm64.tar.gz
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Require exact native runtime cache matches
        if: (matrix.runtime == 'windows-x64' && steps.runtime_windows.outputs.cache-hit != 'true') || (matrix.runtime == 'mac-universal' && (steps.runtime_mac_x64.outputs.cache-hit != 'true' || steps.runtime_mac_arm64.outputs.cache-hit != 'true'))
        run: exit 1
      - name: Install and verify native runtime
        run: node scripts/install-ffmpeg-runtime.js '${{ matrix.runtime }}' 2>&1 | tee build-runtime.log
      - name: Install dependencies
        run: npm ci --no-audit --no-fund 2>&1 | tee build-install.log
      - name: Test application
        run: npm test 2>&1 | tee build-tests.log
      - name: Build native viewer and archive
        run: npm run build:viewer:${{ matrix.platform }} 2>&1 | tee build-viewer.log
      - name: Verify the packaged Viewer can transcode offline
        run: node scripts/check-packaged-ffmpeg.js viewer 2>&1 | tee build-viewer-ffmpeg.log
      - name: Transfer verified full Viewer template through cache
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          key: wsmb-template-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: |
            Windows-Mac-Software-Builder/dist/export-templates/${{ matrix.target }}.zip
            Windows-Mac-Software-Builder/dist/export-templates/${{ matrix.target }}.manifest.json
          enableCrossOsArchive: true

  builder-installers:
    name: Builder installer (${{ matrix.target }})
    needs: [viewer-templates, ffmpeg-native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Windows
            platform: win
            runtime: windows-x64
            runner: windows-latest
          - target: macOS
            platform: mac
            runtime: mac-universal
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Windows-Mac-Software-Builder/package-lock.json
      - name: Restore exact windows-x64 runtime
        if: matrix.runtime == 'windows-x64'
        id: runtime_windows
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          key: wsmb-runtime-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-windows-x64
          path: Windows-Mac-Software-Builder/dist/runtime-native/windows-x64.tar.gz
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Restore exact mac-x64 runtime
        if: matrix.runtime == 'mac-universal'
        id: runtime_mac_x64
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          key: wsmb-runtime-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-mac-x64
          path: Windows-Mac-Software-Builder/dist/runtime-native/mac-x64.tar.gz
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Restore exact mac-arm64 runtime
        if: matrix.runtime == 'mac-universal'
        id: runtime_mac_arm64
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          key: wsmb-runtime-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-mac-arm64
          path: Windows-Mac-Software-Builder/dist/runtime-native/mac-arm64.tar.gz
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Require exact native runtime cache matches
        if: (matrix.runtime == 'windows-x64' && steps.runtime_windows.outputs.cache-hit != 'true') || (matrix.runtime == 'mac-universal' && (steps.runtime_mac_x64.outputs.cache-hit != 'true' || steps.runtime_mac_arm64.outputs.cache-hit != 'true'))
        run: exit 1
      - name: Install and verify native runtime
        run: node scripts/install-ffmpeg-runtime.js '${{ matrix.runtime }}' 2>&1 | tee build-runtime.log
      - name: Install dependencies
        run: npm ci --no-audit --no-fund 2>&1 | tee build-install.log
      - name: Restore exact windows-x64 template
        id: template_windows
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          key: wsmb-template-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-windows-x64
          path: |
            Windows-Mac-Software-Builder/dist/export-templates/windows-x64.zip
            Windows-Mac-Software-Builder/dist/export-templates/windows-x64.manifest.json
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Restore exact mac-universal template
        id: template_mac
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          key: wsmb-template-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-mac-universal
          path: |
            Windows-Mac-Software-Builder/dist/export-templates/mac-universal.zip
            Windows-Mac-Software-Builder/dist/export-templates/mac-universal.manifest.json
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Require both exact template cache matches
        if: steps.template_windows.outputs.cache-hit != 'true' || steps.template_mac.outputs.cache-hit != 'true'
        run: exit 1
      - name: Share identical FFmpeg source archives across Builder templates
        run: node scripts/deduplicate-template-sources.js 2>&1 | tee build-template-sources.log
      - name: Exercise real Electron exports and link navigation
        run: npm run test:electron 2>&1 | tee build-electron-smoke-source.log
      - name: Play transcoded IPTV in real Electron from source
        run: npm run test:electron:iptv 2>&1 | tee build-iptv-smoke-source.log
      - name: Build native Builder installer with both templates
        run: npm run build:builder:${{ matrix.platform }} 2>&1 | tee build-builder.log
      - name: Verify the packaged Builder can transcode offline
        run: node scripts/check-packaged-ffmpeg.js builder 2>&1 | tee build-builder-ffmpeg.log
      - name: Verify packaged app and both embedded templates
        run: npm run verify:package 2>&1 | tee build-verification.log
      - name: Exercise packaged export code and dependencies in real Electron
        run: npm run test:electron:packaged 2>&1 | tee build-electron-smoke-packaged.log
      - name: Play transcoded IPTV using packaged code and FFmpeg
        run: npm run test:electron:iptv:packaged 2>&1 | tee build-iptv-smoke-packaged.log
      - name: Measure package sizes
        run: node scripts/report-package-size.js 2>&1 | tee build-package-size.log
      - name: Write installer checksums
        run: npm run checksums 2>&1 | tee build-checksums.log
      - name: Prepare release payload after every native check succeeds
        run: node scripts/release-payload.js '${{ matrix.target }}'
      - name: Transfer tested installer and proof through cache
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          key: wsmb-release-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: Windows-Mac-Software-Builder/dist/release/${{ matrix.target }}
          enableCrossOsArchive: true

  publish-tested-release:
    name: Publish both verified installers
    needs: builder-installers
    # Pushes still compile and test, but only an explicit dispatch or this
    # repository's own PR publishes. A later merge cannot overwrite the release.
    if: needs.builder-installers.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Restore exact tested Windows installer
        id: release_windows
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          key: wsmb-release-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-Windows
          path: Windows-Mac-Software-Builder/dist/release/Windows
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Restore exact tested macOS installer
        id: release_mac
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          key: wsmb-release-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-macOS
          path: Windows-Mac-Software-Builder/dist/release/macOS
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Require both exact verified installer cache matches
        if: steps.release_windows.outputs.cache-hit != 'true' || steps.release_mac.outputs.cache-hit != 'true'
        run: exit 1
      - name: Verify payload hashes and matching source trees, then publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-tested-release.js
